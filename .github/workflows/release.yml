name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME - $(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" --notes "$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
